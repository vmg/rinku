name: Ruby CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ruby-version:
          - '4.0'
          - 3.4
          - 3.3
          - 3.2
        os: [ ubuntu-latest ]
        include:
          - ruby-version: 3.1
            os: ubuntu-24.04
          - ruby-version: '3.0'
            os: ubuntu-24.04
          - ruby-version: '2.6'
            os: ubuntu-24.04
          - ruby-version: '2.5'
            os: ubuntu-24.04
          - ruby-version: '2.4'
            os: ubuntu-24.04
          - ruby-version: '2.3'
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run tests
        run: bundle exec rake
